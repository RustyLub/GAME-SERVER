name: Deploy dual-domain site to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install backend dependencies
        run: npm install --prefix backend --no-audit --no-fund

      - name: Audit production backend dependencies
        run: npm audit --prefix backend --omit=dev --audit-level=high

      - name: Build and verify rusty-lub.online
        env:
          SITE_ORIGIN: https://rusty-lub.online
        run: |
          node scripts/check-public-config.mjs
          npm run build
          npm run verify:release
          mv dist dist-online

      - name: Build and verify rusty-lub.ru
        env:
          SITE_ORIGIN: https://rusty-lub.ru
        run: |
          npm run build
          npm run verify:release
          mv dist dist-ru
          mv dist-online dist

      - name: Deploy both domains from one Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=rustylub-network --branch=main
