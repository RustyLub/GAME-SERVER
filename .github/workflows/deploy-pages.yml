name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          node scripts/check-public-config.mjs
          npm run test:config
          SITE_ORIGIN=https://rusty-lub.online npm run build
          SITE_ORIGIN=https://rusty-lub.online npm run verify:release
          mv dist dist-online
          SITE_ORIGIN=https://rusty-lub.ru npm run build
          SITE_ORIGIN=https://rusty-lub.ru npm run verify:release
          mv dist dist-ru
          mv dist-online dist
      - name: Verify prerendered routes, metadata and public assets
        run: npm run verify:release
      - name: Check backend and deployment script syntax
        run: |
          node --check backend/src/server.js
          node --check scripts/configure-github-variables.mjs
          node --check scripts/configure-github-variables.test.mjs
          node --test scripts/configure-github-variables.test.mjs
          bash -n backend/deploy-cloud-run.sh
          bash -n backend/deploy-auth-hosting.sh
      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install backend dependencies
        run: npm install --prefix backend --no-audit --no-fund
      - name: Commit reproducible npm lockfiles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add reproducible npm lockfiles [skip ci]"
            git push origin HEAD:main
            gh workflow run deploy-pages.yml --ref main
          fi
      - name: Upload generated npm lockfiles
        uses: actions/upload-artifact@v5
        with:
          name: npm-lockfiles
          path: |
            package-lock.json
            backend/package-lock.json
          if-no-files-found: error
      - name: Audit all dependencies
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix backend --audit-level=moderate
      - name: Test backend and Firestore rules
        run: npx --yes firebase-tools@15.37.0 emulators:exec --only firestore --project demo-rustylub-rules "npm test --prefix backend"
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Diagnose interim apex DNS and GitHub Pages certificate
        continue-on-error: true
        run: |
          echo "Current IPv4 DNS answers:"
          getent ahostsv4 rusty-lub.online | awk '{print $1}' | sort -u || true
          echo "Current IPv6 DNS answers:"
          getent ahostsv6 rusty-lub.online | awk '{print $1}' | sort -u || true
          echo "Testing GitHub Pages edge addresses with the apex hostname and SNI:"
          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            result="$(curl --silent --show-error --location --max-time 15 --resolve "rusty-lub.online:443:$ip" --output /dev/null --write-out '%{http_code}|%{url_effective}' https://rusty-lub.online/ 2>&1)" || true
            echo "$ip -> $result"
          done
          echo "Certificate currently presented by public DNS:"
          timeout 15 openssl s_client -connect rusty-lub.online:443 -servername rusty-lub.online </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName || true

      - name: Probe interim HTTPS endpoint
        continue-on-error: true
        run: |
          if result="$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{url_effective}|%{http_code}' https://rusty-lub.online/)"; then
            final_url="${result%%|*}"
            status="${result##*|}"
            echo "HTTPS probe: $final_url (HTTP $status)"
            if (( status < 200 || status >= 400 )); then
              echo "::warning::The interim HTTPS endpoint returned HTTP $status."
            fi
            case "$final_url" in
              https://rusty-lub.online/*) ;;
              *) echo "::warning::The interim site redirected away from rusty-lub.online." ;;
            esac
          else
            echo "::warning::HTTPS is not yet verifiable for rusty-lub.online. Check DNS, certificate status and Enforce HTTPS in Settings → Pages."
          fi

